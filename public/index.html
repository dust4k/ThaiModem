<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f5c5b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ThaiModem" />
    <meta
      name="description"
      content="Two-way English–Thai translator and language learning tool powered by Grok."
    />
    <title>ThaiModem</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div id="banner" class="banner banner-warn hidden" role="alert"></div>

    <main class="app">
      <section class="panel panel-input" id="input-panel" aria-label="Input">
        <header class="panel-header">
          <span class="panel-kicker">Input</span>
          <h1 id="input-language">English / ไทย</h1>
        </header>
        <label class="sr-only" for="input-text">Text to translate</label>
        <textarea
          id="input-text"
          rows="4"
          placeholder="Enter text to translate"
          autocomplete="off"
          autocorrect="on"
          spellcheck="true"
        ></textarea>
        <button id="submit-btn" class="submit-btn" type="button">
          Translate
        </button>
      </section>

      <nav class="control-bar" aria-label="Translator controls">
        <button id="clear-btn" class="bar-btn" type="button">Clear</button>
        <button id="saved-btn" class="bar-btn saved-btn" type="button">
          Saved
          <span id="saved-count" class="saved-count hidden" aria-hidden="true"></span>
        </button>
        <button id="paste-btn" class="bar-btn icon-btn" type="button" aria-label="Paste from clipboard">
          <svg class="bar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          </svg>
        </button>
        <button id="settings-btn" class="bar-btn icon-btn" type="button" aria-label="Settings">
          ⚙
        </button>
      </nav>

      <section class="panel panel-output" id="output-panel" aria-label="Output" aria-live="polite">
        <header class="panel-header">
          <span class="panel-kicker">Output</span>
          <h2 id="output-language">Translation</h2>
        </header>
        <div id="output-scroll" class="output-scroll">
          <div id="output-empty" class="empty-state">
            Translation appears here, with romanization and a word-by-word breakdown.
          </div>
          <div id="output-loading" class="loading-state hidden">
            <div class="spinner" aria-hidden="true"></div>
            <p id="output-loading-text">Translating…</p>
          </div>
          <div id="output-result" class="result-stack hidden"></div>
        </div>
      </section>
    </main>

    <dialog id="settings-modal" class="settings-modal">
      <form id="settings-form" method="dialog">
        <header>
          <h2>Settings</h2>
          <p>Your xAI key stays on this iPhone in local storage.</p>
        </header>
        <label>
          xAI API key
          <input
            id="api-key-input"
            type="password"
            name="apiKey"
            autocomplete="off"
            placeholder="xai-…"
          />
        </label>
        <label>
          Model
          <select id="model-select" name="model">
            <option value="grok-4">grok-4</option>
            <option value="grok-4-fast">grok-4-fast</option>
            <option value="grok-4-fast-reasoning">grok-4-fast-reasoning</option>
            <option value="grok-3">grok-3</option>
            <option value="grok-3-mini">grok-3-mini</option>
          </select>
        </label>
        <p class="settings-help">
          Create a key at
          <a href="https://console.x.ai/" target="_blank" rel="noopener noreferrer">console.x.ai</a>.
        </p>
        <menu>
          <button id="settings-cancel" type="button" class="bar-btn">Cancel</button>
          <button id="settings-save" value="default" type="submit" class="bar-btn bar-btn-primary">
            Done
          </button>
        </menu>
      </form>
    </dialog>

    <dialog id="repository-modal" class="repository-modal">
      <div class="repository-body">
        <div id="repository-list-view" class="repository-view">
          <header>
            <h2>Saved words</h2>
            <p><span id="repository-count">0</span> saved on this device</p>
          </header>
          <div id="repository-list" class="repository-list"></div>
          <div id="repository-context" class="repository-context hidden" aria-live="polite"></div>
          <menu class="repository-menu">
            <button id="repository-context-btn" type="button" class="bar-btn hidden" disabled>
              Show context
            </button>
            <button id="repository-practice" type="button" class="bar-btn hidden">Practice</button>
            <button id="repository-close" type="button" class="bar-btn bar-btn-primary">Done</button>
          </menu>
        </div>

        <div id="repository-practice-view" class="repository-view hidden">
          <header>
            <h2>Practice</h2>
            <p id="flashcard-progress" class="flashcard-progress">1 / 1</p>
          </header>
          <div id="flashcard-card" class="flashcard-card">
            <p id="flashcard-pos" class="flashcard-pos"></p>
            <p id="flashcard-prompt" class="flashcard-prompt"></p>
            <label class="sr-only" for="flashcard-input">Thai translation</label>
            <input
              id="flashcard-input"
              class="flashcard-input"
              type="text"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
              placeholder="Type the Thai translation"
            />
            <div id="flashcard-feedback" class="flashcard-feedback hidden" role="status"></div>
          </div>
          <div id="flashcard-summary" class="flashcard-summary hidden">
            <p id="flashcard-score"></p>
          </div>
          <menu class="flashcard-actions">
            <button id="flashcard-exit" type="button" class="bar-btn">Exit</button>
            <button id="flashcard-check" type="button" class="bar-btn bar-btn-primary">Check</button>
            <button id="flashcard-next" type="button" class="bar-btn bar-btn-primary hidden">Next</button>
            <button id="flashcard-again" type="button" class="bar-btn bar-btn-primary hidden">
              Practice again
            </button>
          </menu>
        </div>
      </div>
    </dialog>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
